name: validate

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python plugins/math-modeling-workflow/scripts/validate_repo.py .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python helpers
        run: python -m compileall -q plugins/math-modeling-workflow/scripts tests
